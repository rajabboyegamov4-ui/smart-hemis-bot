<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMIS Student Portal</title>
    <!-- Tailwind CSS (Zamonaviy dizayn uchun) -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <!-- FontAwesome (Ikonkalar uchun) -->
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
    <style>
        /* HEMISning rasmiy to'q ko'k rangi */
        .bg-hemis-dark { background-color: #0f172a; }
        .text-hemis-dark { color: #0f172a; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-10">

    <!-- Header qismi -->
    <header class="bg-hemis-dark text-white shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center p-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-blue-400"></i>
                <h1 class="text-xl font-bold tracking-wide">HEMIS</h1>
            </div>
            <button class="text-white text-xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        
        <!-- Talaba profili qisqacha -->
        <div class="px-4 pb-4">
            <div class="flex items-center gap-4 bg-white/10 p-3 rounded-xl border border-white/20">
                <div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-sm">Egamov Rajabboy</h2>
                    <p class="text-xs text-blue-200">Talaba ID: 306241100302</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Asosiy menyu kartochkalari -->
    <main class="p-4 grid grid-cols-2 gap-4 mt-2">
        
        <!-- Dars Jadvali -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl">
                <i class="fa-solid fa-calendar-days"></i>
            </div>
            <h3 class="font-medium text-gray-700 text-sm text-center">Dars jadvali</h3>
        </div>

        <!-- O'zlashtirish (Baholar) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
            <div class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-xl">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <h3 class="font-medium text-gray-700 text-sm text-center">O'zlashtirish</h3>
        </div>

        <!-- Fanlar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
            <div class="w-12 h-12 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xl">
                <i class="fa-solid fa-book"></i>
            </div>
            <h3 class="font-medium text-gray-700 text-sm text-center">Fanlar</h3>
        </div>

        <!-- AI Yordamchi (Sizning funksiyangiz) -->
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-4 rounded-2xl shadow-md text-white flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform shadow-purple-200">
            <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-xl">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h3 class="font-medium text-sm text-center">AI Yordamchi</h3>
        </div>

    </main>

    <!-- Kichik statistika -->
    <section class="px-4 mt-2">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500 uppercase font-semibold">Umumiy GPA</p>
                <p class="text-2xl font-bold text-hemis-dark">4.2</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500 uppercase font-semibold">Kurs</p>
                <p class="text-2xl font-bold text-hemis-dark">3-Kurs</p>
            </div>
        </div>
    </section>

    <script>
        // Telegram Web App ni ishga tushirish
        let tg = window.Telegram.WebApp;
        tg.expand(); // Ekranni to'liq egallash
    </script>
</body>
</html>
